[project]
name = "netcheck"
version = "1.0.0"
description = "Network Health Checker - Self-service network diagnostics for non-technical users"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5.0",
    "psutil>=5.9.0",
    "dnspython>=2.4.0",
]

[project.scripts]
netcheck = "netcheck.app:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

